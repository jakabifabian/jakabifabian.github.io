<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Health Declarations & Arrival Forms</title>
  <style>
    :root {
      font-family: system-ui, sans-serif;
      color: #f8fafc;
      background: #0f172a;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1e293b, #0f172a);
    }

    main {
      width: min(680px, calc(100% - 32px));
      text-align: center;
    }

    h1 {
      margin-bottom: 28px;
      font-size: clamp(2rem, 7vw, 3.5rem);
    }

    .links {
      display: grid;
      gap: 12px;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      color: inherit;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      text-decoration: none;
      transition: 0.2s ease;
    }

    .link:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.14);
    }
  </style>
</head>
<body>
  <main>
    <h1>My Links</h1>

    <div class="links">
      <a class="link" href="https://porthealth.dhmis.org/travel/" target="_blank">
        <strong>SouthAfrica</strong><span>↗</span>
      </a>

      <a class="link" href="https://linkedin.com" target="_blank">
        <strong>LinkedIn</strong><span>↗</span>
      </a>

      <a class="link" href="https://example.com" target="_blank">
        <strong>My Website</strong><span>↗</span>
      </a>

      <a class="link" href="mailto:you@example.com">
        <strong>Email Me</strong><span>↗</span>
      </a>
    </div>
  </main>
</body>
</html>
